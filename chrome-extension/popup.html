<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      font-family: sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 0;
      background: #1a1d27;
      color: #e0e0e0;
    }
    .header {
      padding: 12px 14px 8px;
      font-weight: 600;
      font-size: 14px;
      color: #4FC3F7;
      border-bottom: 1px solid #2a2d3a;
    }
    .item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s;
    }
    .item:hover { background: #2a2d3a; }
    .item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1D9E75;
      flex-shrink: 0;
    }
    .item .dot.hidden { background: #666; }
    .footer {
      padding: 8px 14px;
      font-size: 11px;
      color: #555;
      border-top: 1px solid #2a2d3a;
    }
  </style>
</head>
<body>
  <div class="header">⚡ Syncbridge</div>
  <div class="item" id="toggle-widget">
    <div class="dot" id="status-dot"></div>
    <span id="toggle-label">Hide floating icon</span>
  </div>
  <div class="footer">Active in background</div>
  <script src="popup.js"></script>
</body>
</html>
